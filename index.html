 try{await sleep(700+Math.random()*400);S.P[t]=P;draw(t);$('#a-'+t).hidden=false;
  if(!again){let L=hist().filter(x=>!(x.tool===t&&x.q===P.q&&x.plat===P.plat));L.unshift({tool:t,q:P.q,work:P.work,plat:P.plat,t:Date.now()});store.set('sfai_hist',L.slice(0,12));renderHist()}}
 catch(e){$('#r-'+t).innerHTML='<div class="empty">Something went wrong generating results. Please try again.</div>';console.error(e)}
 S.busy=false;$$('.btn').forEach(b=>b.disabled=false)}

/* ---------- video upload ---------- */
function setFile(f){const pv=$('#pv');if(S.file&&S.file.url)URL.revokeObjectURL(S.file.url);
 if(!f){S.file=null;pv.innerHTML='';return}
 if(!f.type.startsWith('video/')){fail('title','That file is not a video. Please choose an MP4, MOV or WebM file.');return}
 S.file={name:f.name,size:f.size,url:URL.createObjectURL(f)};$('#e-title').textContent='';
 pv.innerHTML=`<video controls muted playsinline src="${S.file.url}"></video><div class="mu" id="fi" style="font-size:13px;margin-top:8px">${esc(f.name)} · ${(f.size/1048576).toFixed(1)} MB</div><button class="cb" id="rmv" type="button" style="margin-top:8px">Remove</button>`;
 const v=$('video',pv);v.onloadedmetadata=()=>{S.file.dur=v.duration;S.file.w=v.videoWidth;S.file.h=v.videoHeight;$('#fi').textContent+=` · ${Math.round(v.duration)}s · ${v.videoWidth}×${v.videoHeight}`};
 v.onerror=()=>{$('#fi').textContent+=' · preview unavailable for this format (filename will still be used)'}}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target;let b;
 if(b=t.closest('[data-ci]')){copy(CP[b.dataset.ci]);b.classList.add('ok');setTimeout(()=>b.classList.remove('ok'),900);return}
 if(b=t.closest('[data-go]'))return go(b.dataset.go);
 if(t.closest('#logo'))return go('home');if(t.closest('#setb'))return go('set');
 if(b=t.closest('#plat button'))return setPlat(b.dataset.p);
 if(b=t.closest('[data-ex]')){const[id,q]=b.dataset.ex.split('|');$('#i-'+id).value=q;return run(id)}
 if(b=t.closest('[data-st]')){S.style=b.dataset.st;$$('[data-st]').forEach(c=>c.classList.toggle('on',c===b));return}
 if(b=t.closest('[data-h]')){const x=hist()[b.dataset.h];go(x.tool);if(x.tool==='title'){$('#i-title').value=x.q;$('#w-title').value=x.work||''}else $('#i-'+x.tool).value=x.q;setPlat(x.plat,true);return run(x.tool)}
 if(b=t.closest('[id^=g-]'))return run(b.id.slice(2));
 if(b=t.closest('[id^=a-]'))return run(b.id.slice(2),true);
 if(t.closest('#ub')||t.id==='dz'){$('#vf').click();return}
 if(t.closest('#rmv')){setFile(null);$('#vf').value='';return}
 if(t.closest('#s-clr')){store.set('sfai_hist',[]);renderHist();toast('History cleared')}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input[id^=i-]'))run(e.target.id.slice(2))});
document.addEventListener('input',e=>{if(e.target.id&&/^[iw]-/.test(e.target.id))$('#e-'+e.target.id.slice(2)).textContent=''});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='vf')return t.files[0]&&setFile(t.files[0]);
 if(t.id==='s-plat'){S.set.plat=t.value;setPlat(t.value)}
 if(t.id==='s-sh')S.set.sh=t.value==='1';if(t.id==='s-n')S.set.n=+t.value;
 if(t.id&&t.id.startsWith('s-'))store.set('sfai_set',S.set)});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const z=e.target.closest&&e.target.closest('#dz');if(!z)return;e.preventDefault();z.classList.toggle('over',ev==='dragover');if(ev==='drop'&&e.dataTransfer.files[0])setFile(e.dataTransfer.files[0])}));
build();
</script></body></html>
